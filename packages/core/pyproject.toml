[project]
name = "mtps-core"
version = "0.1.0"
description = "Shared contracts (interfaces, schemas, state, gates) for the MACE-TPS workbench. No heavy scientific deps on purpose - everyone installs this."
requires-python = ">=3.9"
dependencies = []

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*"]
