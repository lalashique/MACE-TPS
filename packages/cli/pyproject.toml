[project]
name = "mtps-cli"
version = "0.1.0"
description = "CLI for the MACE-TPS workbench. A GUI can be added later as its own package driving the same workflow.WorkflowEngine - nothing here is CLI-specific except argument parsing and printing."
requires-python = ">=3.9"
dependencies = ["mtps-core", "mtps-workflow", "click"]

[project.scripts]
mtps = "cli.main:cli"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cli*"]
